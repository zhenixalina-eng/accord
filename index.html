<meta charset="utf-8">
<!-- Без этого телефон рисует страницу как десктопную (~980px) и уменьшает целиком,
     а все мобильные правила ниже не включаются -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Укулельная тетрадь</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@500&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
  /* Два оформления. Переключаются атрибутом data-skin на <html>, выбор помнится в браузере.
     Всё остальное в стилях опирается только на эти переменные. */

  /* ВИНИЛ — тёплый конверт, оранжевый и плотный гротеск */
  :root, :root[data-skin="vinyl"] {
    --bg: #f2e6cf;
    --surface: #fbf3e3;
    --surface-2: #e6d4b4;
    --border: #c9a97a;
    --ink: #241708;
    --ink-soft: #7c5c38;
    --accent: #d1471a;
    --accent-strong: #a83612;
    --accent-wash: rgba(209, 71, 26, 0.12);
    --shadow: rgba(80, 45, 15, 0.3);
    --font-display: 'Russo One', system-ui, sans-serif;
    --font-body: 'Golos Text', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --title-weight: 400;
    --title-tt: none;
    --title-ls: 0;
    --radius: 8px;
    --radius-pill: 999px;
  }

  /* СЦЕНА — чёрный зал, тёплый свет, аккорды горят янтарным */
  :root[data-skin="stage"] {
    --bg: #121215;
    --surface: #1a1a1f;
    --surface-2: #24242b;
    --border: #32323a;
    --ink: #e9e5dc;
    --ink-soft: #8f8b81;
    --accent: #ffb545;
    --accent-strong: #ffc978;
    --accent-wash: rgba(255, 181, 69, 0.13);
    --shadow: rgba(0, 0, 0, 0.6);
    --font-display: 'Oswald', system-ui, sans-serif;
    --font-body: 'Golos Text', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --title-weight: 500;
    --title-tt: uppercase;
    --title-ls: 0.03em;
    --radius: 8px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 0 20px;
    padding-block: 28px 64px;
  }

  a { color: inherit; }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
  }

  header.site {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }

  .site-title {
    font-family: var(--font-display);
    font-weight: var(--title-weight);
    font-size: clamp(26px, 4vw, 36px);
    letter-spacing: var(--title-ls);
    text-transform: var(--title-tt);
    line-height: 1.08;
    text-wrap: balance;
  }

  /* Кнопки должны переноситься: нерастяжимый ряд делал страницу шире экрана,
     и вся вёрстка уезжала вправо */
  .skins {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .skin-btn {
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 5px 11px;
    cursor: pointer;
  }

  .skin-btn:hover { color: var(--ink); border-color: var(--accent); }

  .skin-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  .skin-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .site-tagline {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 40ch;
  }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* Песен может быть много, поэтому меню прокручивается само, не утягивая страницу */
  nav.songlist {
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding-right: 4px;
  }

  /* На десктопе каталог — колонка слева; кнопка и подложка не нужны */
  .catalog-btn, .catalog-backdrop, .catalog-close { display: none; }

  .catalog-head h2 { margin: 0 0 2px 2px; }

  /* На телефоне список исполнителей стеной закрывал бы песню,
     поэтому каталог уезжает в выдвижную панель поверх страницы */
  @media (max-width: 760px) {
    .catalog-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }

    .catalog-btn-ico { font-size: 15px; color: var(--ink-soft); }

    nav.songlist {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(330px, 88vw);
      max-height: none;
      z-index: 80;
      background: var(--bg);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 40px -10px var(--shadow);
      padding: 18px 14px;
      overflow-y: auto;
      transform: translateX(-101%);
      transition: transform 0.22s ease;
    }

    nav.songlist.open { transform: none; }

    .catalog-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0.35);
    }

    .catalog-backdrop[hidden] { display: none; }

    .catalog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .catalog-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    nav.songlist { transition: none; }
  }

  .song-search {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 7px 12px;
    width: 100%;
  }

  .song-search::placeholder { color: var(--ink-soft); }
  .song-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .search-info {
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 2px;
  }

  .search-info[hidden] { display: none; }

  .artist-group.flash {
    background: var(--accent-wash);
    border-radius: var(--radius);
    box-shadow: 0 0 0 2px var(--accent);
  }

  @media (prefers-reduced-motion: no-preference) {
    .artist-group { transition: box-shadow 0.3s ease, background 0.3s ease; }
  }

  .songlist h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 2px 2px;
  }

  .artist-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .artist-head {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    padding: 4px 2px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    text-align: left;
    width: 100%;
  }

  .artist-head:hover .artist-name { color: var(--accent-strong); }
  .artist-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }

  .artist-head .chev {
    font-size: 10px;
    color: var(--ink-soft);
    transition: transform 0.15s ease;
  }

  .artist-group.collapsed .chev { transform: rotate(-90deg); }
  .artist-group.collapsed .song-btn { display: none; }

  .artist-name {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
  }

  .artist-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .song-btn {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px;
    margin-left: 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }

  .song-btn:hover { background: var(--surface-2); }

  .song-btn.active {
    background: var(--accent-wash);
    border-color: var(--accent);
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .artist-head .chev { transition: none; }
  }

  main.sheet {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px clamp(16px, 3vw, 32px) 32px;
    box-shadow: 0 8px 24px -12px var(--shadow);
  }

  /* Переключатели всегда своей строкой под заголовком: иначе они прыгали то вправо
     от названия, то под него — в зависимости от длины названия песни */
  .sheet-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 16px;
    margin-bottom: 16px;
  }

  .song-title {
    font-family: var(--font-display);
    font-weight: var(--title-weight);
    font-size: clamp(21px, 3.4vw, 29px);
    letter-spacing: var(--title-ls);
    text-transform: var(--title-tt);
    line-height: 1.08;
    text-wrap: balance;
  }

  .song-artist { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }

  .artist-link {
    display: block;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 3px;
  }

  .artist-link:hover { color: var(--accent-strong); text-decoration-color: var(--accent); }
  .artist-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 4px 6px;
  }

  .ctrl-group span.label {
    font-size: 11px;
    color: var(--ink-soft);
    padding: 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .ctrl-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .ctrl-btn:hover { background: var(--accent-wash); border-color: var(--accent); }
  .ctrl-btn:focus-visible, .song-btn:focus-visible, .chord-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .scrollctl {
    position: fixed;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 6px;
    box-shadow: 0 10px 24px -8px var(--shadow);
  }

  .scroll-arrow {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scroll-arrow:hover { background: var(--accent-wash); border-color: var(--accent); }
  .scroll-arrow:active { background: var(--accent); color: var(--surface); }

  .scroll-speed-val {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-strong);
    min-height: 1.2em;
  }

  .scroll-speed-val.active { color: var(--accent); }

  /* На телефоне — тоже справа, но внизу: там её достаёт большой палец,
     и она не перекрывает колонку закреплённых аккордов у верхнего края */
  @media (max-width: 620px) {
    .scrollctl { top: auto; bottom: 16px; right: 10px; transform: none; }
  }

  .inst-btn {
    border: 1px solid transparent;
    background: none;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12.5px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }

  .inst-btn:hover { color: var(--ink); }

  .inst-btn.active {
    background: var(--accent-wash);
    border-color: var(--accent);
    color: var(--accent-strong);
    font-weight: 600;
  }

  .inst-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .key-badge {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--accent-strong);
    min-width: 2.4ch;
    text-align: center;
    font-size: 13.5px;
  }

  .fontsize-val {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    min-width: 3ch;
    text-align: center;
  }

  .variant-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .variant-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-right: 2px;
  }

  .variant-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 5px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .variant-btn:hover { border-color: var(--accent); color: var(--ink); }

  .variant-btn.active {
    background: var(--accent-wash);
    border-color: var(--accent);
    color: var(--accent-strong);
    font-weight: 600;
  }

  .variant-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chord-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  .chord-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 6px 5px;
    cursor: pointer;
    color: var(--ink-soft);
    font-family: inherit;
  }

  .chord-card:hover { border-color: var(--accent); }

  .chord-card.pinned {
    border-color: var(--accent);
    color: var(--accent-strong);
    background: var(--accent-wash);
  }

  .chord-card .cc-name {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
  }

  .chord-card.pinned .cc-name { color: var(--accent-strong); }

  .chord-card .cc-noshape {
    font-size: 10px;
    color: var(--ink-soft);
    padding: 14px 4px;
  }

  .chord-svg { display: block; color: inherit; }

  /* Текст песни и закреплённые аккорды рядом: аккорды — узкой колонкой справа,
     прилипают при прокрутке, чтобы всегда были на уровне глаз рядом со строчками */
  .sheet-body {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .pinned-panel {
    position: sticky;
    top: 10px;
    z-index: 20;
    flex-shrink: 0;
    width: 108px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 8px;
    box-shadow: 0 6px 18px -10px var(--shadow);
  }

  .pinned-panel .ph {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    font-weight: 600;
    text-align: center;
  }

  .pinned-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 70vh;
    overflow-y: auto;
  }

  /* На телефоне колонка остаётся справа, только уже — чтобы строкам хватало места */
  @media (max-width: 620px) {
    .sheet-body { gap: 10px; }
    .pinned-panel { width: 88px; padding: 6px; }
    .pinned-panel .ph { font-size: 9px; letter-spacing: 0; }
    .pinned-list { gap: 8px; max-height: 60vh; }
  }

  .pinned-item {
    position: relative;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 4px 2px;
    color: var(--accent-strong);
  }

  /* Гитарная схема шире укулельной — в узкой колонке ужимаем по месту */
  .pinned-item .chord-svg { max-width: 100%; height: auto; }

  .pinned-item .cc-name {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 13px;
  }

  .unpin-btn {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chordsheet-scroll {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    padding-bottom: 4px;
    cursor: pointer;
  }

  .chordsheet {
    font-family: var(--font-mono);
    line-height: 1.55;
    white-space: pre;
    width: max-content;
    min-width: 100%;
  }

  .line { margin-bottom: 2px; }
  .line.blank { height: 0.9em; }

  .chords {
    color: var(--accent-strong);
    font-weight: 800;
  }


  .lyrics { color: var(--ink); }

  footer.note {
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    main.sheet { animation: rise 0.25s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
</style>

<div class="wrap">
  <header class="site">
    <div>
      <div class="site-title">Укулельная тетрадь</div>
      <div class="site-tagline">Аккорды, переснятые из тетради и скринов — набело, для игры на укулеле и гитаре.</div>
    </div>
    <div class="skins" id="skins" aria-label="Оформление">
      <button type="button" class="skin-btn" data-skin="vinyl">Винил</button>
      <button type="button" class="skin-btn" data-skin="stage">Сцена</button>
    </div>
  </header>

  <div class="layout">
    <button type="button" class="catalog-btn" id="catalog-btn" aria-expanded="false">
      <span class="catalog-btn-ico">☰</span>
      <span id="catalog-btn-label">Каталог песен</span>
    </button>

    <div class="catalog-backdrop" id="catalog-backdrop" hidden></div>

    <nav class="songlist" id="songlist" aria-label="Список песен">
      <div class="catalog-head">
        <h2>Песни</h2>
        <button type="button" class="catalog-close" id="catalog-close" aria-label="Закрыть каталог">✕</button>
      </div>
      <input type="search" id="song-search" class="song-search" placeholder="Название или исполнитель" autocomplete="off" aria-label="Поиск песни">
      <div class="search-info" id="search-info" hidden></div>
    </nav>

    <main class="sheet" id="sheet"></main>
  </div>

  <footer class="note">Листать вручную можно не останавливая автопрокрутку — она продолжит с нового места. Тап по тексту ставит её на паузу.</footer>
</div>

<div class="scrollctl" id="scrollctl">
  <button type="button" class="scroll-arrow" id="scroll-faster" aria-label="Быстрее (запускает прокрутку)">▲</button>
  <div class="scroll-speed-val" id="scroll-speed-val">0</div>
  <button type="button" class="scroll-arrow" id="scroll-slower" aria-label="Медленнее">▼</button>
</div>

<script>
  let SONGS = [];

  // Файл песни: шапка (title/artist/key), пустая строка, дальше текст с аккордами.
  // Если для песни есть несколько вариантов аккордов, каждый начинается строкой
  // «--- Название варианта», под которой может стоять свой key.
  function parseSongFile(text) {
    const lines = text.split('\n');
    let i = 0;
    const meta = {};
    while (i < lines.length && lines[i].trim() !== '') {
      const m = lines[i].match(/^(\w+):\s*(.*)$/);
      if (m) meta[m[1]] = m[2].trim();
      i++;
    }

    const song = { title: meta.title || '', artist: meta.artist || '', key: meta.key || '' };
    const variants = [];
    let current = null;

    const flush = () => {
      if (!current) return;
      const body = current.lines.join('\n').replace(/^\n+|\n+$/g, '');
      if (body) variants.push({ name: current.name, key: current.key || song.key, body });
    };

    for (; i < lines.length; i++) {
      const head = lines[i].match(/^---\s*(.*)$/);
      if (head) {
        flush();
        current = { name: head[1].trim() || `Вариант ${variants.length + 1}`, key: '', lines: [] };
        continue;
      }
      if (!current) current = { name: '', key: '', lines: [] };
      const keyLine = !current.lines.some(l => l.trim()) && lines[i].match(/^key:\s*(.*)$/);
      if (keyLine) { current.key = keyLine[1].trim(); continue; }
      current.lines.push(lines[i]);
    }
    flush();

    song.variants = variants.length ? variants : [{ name: '', key: song.key, body: '' }];
    return song;
  }

  // === SONGS DATA START (генерируется build.mjs из songs/*.txt — вручную не править) ===
  const SONG_FILES = {};
  // === SONGS DATA END ===

  function songFromFile(fname, text) {
    return { id: fname.replace(/\.txt$/, ''), ...parseSongFile(text) };
  }

  // Опубликованная страница берёт песни из вшитого SONG_FILES (его наполняет build.mjs).
  // Пустой SONG_FILES означает локальную разработку — тогда читаем songs/ напрямую.
  async function loadSongs() {
    const inline = Object.entries(SONG_FILES);
    if (inline.length) return inline.map(([fname, text]) => songFromFile(fname, text));

    const idxRes = await fetch('songs/index.json');
    if (!idxRes.ok) throw new Error('songs/index.json: HTTP ' + idxRes.status);
    const files = await idxRes.json();
    return Promise.all(files.map(async fname => {
      const res = await fetch('songs/' + fname);
      if (!res.ok) throw new Error(fname + ': HTTP ' + res.status);
      return songFromFile(fname, await res.text());
    }));
  }

  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FLAT_TO_SHARP = { Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#' };

  // Аппликатуры: номера ладов по струнам, 0 — открытая, -1 — глушится.
  // Укулеле — строй GCEA (4 струны), гитара — EADGBE (6 струн, от басовой к тонкой).
  const SHAPES = {
    uke: {
      'C':[0,0,0,3], 'C#':[1,1,1,4], 'D':[2,2,2,0], 'D#':[3,3,3,1], 'E':[4,4,4,2], 'F':[2,0,1,0],
      'F#':[3,1,2,1], 'G':[0,2,3,2], 'G#':[1,3,4,3], 'A':[2,1,0,0], 'A#':[3,2,1,1], 'B':[4,3,2,2],
      'Cm':[0,3,3,3], 'C#m':[1,4,4,4], 'Dm':[2,2,1,0], 'D#m':[3,3,2,1], 'Em':[0,4,3,2], 'Fm':[1,0,1,3],
      'F#m':[2,1,2,4], 'Gm':[0,2,3,1], 'G#m':[1,3,4,2], 'Am':[2,0,0,0], 'A#m':[3,1,1,1], 'Bm':[4,2,2,2],
      'C7':[0,0,0,1], 'C#7':[1,1,1,2], 'D7':[2,2,2,3], 'D#7':[3,3,3,4], 'E7':[1,2,0,2], 'F7':[2,3,1,3],
      'F#7':[3,4,2,4], 'G7':[0,2,1,2], 'G#7':[1,3,2,3], 'A7':[0,1,0,0], 'A#7':[1,2,1,1], 'B7':[2,3,2,2],
      'Cm7':[3,3,3,3], 'C#m7':[4,4,4,4], 'Dm7':[2,2,1,3], 'D#m7':[3,3,2,4], 'Em7':[0,2,0,2], 'Fm7':[1,3,1,3],
      'F#m7':[2,4,2,4], 'Gm7':[0,2,1,1], 'G#m7':[1,3,2,2], 'Am7':[0,0,0,0], 'A#m7':[1,1,1,1], 'Bm7':[2,2,2,2],
      // m6 и dim пока нужны по одному — из «Ворона» и «Звучи»
      'Em6':[0,1,0,2], 'Adim':[2,3,2,3]
    },
    guitar: {
      'C':[-1,3,2,0,1,0], 'C#':[-1,4,3,1,2,1], 'D':[-1,-1,0,2,3,2], 'D#':[-1,-1,1,3,4,3],
      'E':[0,2,2,1,0,0], 'F':[1,3,3,2,1,1], 'F#':[2,4,4,3,2,2], 'G':[3,2,0,0,0,3],
      'G#':[4,6,6,5,4,4], 'A':[-1,0,2,2,2,0], 'A#':[-1,1,3,3,3,1], 'B':[-1,2,4,4,4,2],
      'Cm':[-1,3,5,5,4,3], 'C#m':[-1,4,6,6,5,4], 'Dm':[-1,-1,0,2,3,1], 'D#m':[-1,-1,1,3,4,2],
      'Em':[0,2,2,0,0,0], 'Fm':[1,3,3,1,1,1], 'F#m':[2,4,4,2,2,2], 'Gm':[3,5,5,3,3,3],
      'G#m':[4,6,6,4,4,4], 'Am':[-1,0,2,2,1,0], 'A#m':[-1,1,3,3,2,1], 'Bm':[-1,2,4,4,3,2],
      'C7':[-1,3,2,3,1,0], 'C#7':[-1,4,3,4,2,1], 'D7':[-1,-1,0,2,1,2], 'D#7':[-1,-1,1,3,2,3],
      'E7':[0,2,0,1,0,0], 'F7':[1,3,1,2,1,1], 'F#7':[2,4,2,3,2,2], 'G7':[3,2,0,0,0,1],
      'G#7':[4,6,4,5,4,4], 'A7':[-1,0,2,0,2,0], 'A#7':[-1,1,3,1,3,1], 'B7':[-1,2,1,2,0,2],
      'Cm7':[-1,3,5,3,4,3], 'C#m7':[-1,4,6,4,5,4], 'Dm7':[-1,-1,0,2,1,1], 'D#m7':[-1,-1,1,3,2,2],
      'Em7':[0,2,0,0,0,0], 'Fm7':[1,3,1,1,1,1], 'F#m7':[2,4,2,2,2,2], 'Gm7':[3,5,3,3,3,3],
      'G#m7':[4,6,4,4,4,4], 'Am7':[-1,0,2,0,1,0], 'A#m7':[-1,1,3,1,2,1], 'Bm7':[-1,2,4,2,3,2],
      'Em6':[0,2,2,0,2,0], 'Adim':[-1,0,1,2,1,-1]
    }
  };

  const INSTRUMENTS = { uke: 'Укулеле', guitar: 'Гитара' };

  function transposeChord(chord, semitones) {
    if (!semitones) return chord;
    const m = chord.match(/^([A-G])(#|b)?(.*)$/);
    if (!m) return chord;
    const [, root, acc, rest] = m;
    let note = root + (acc || '');
    if (FLAT_TO_SHARP[note]) note = FLAT_TO_SHARP[note];
    const idx = NOTES.indexOf(note);
    if (idx === -1) return chord;
    const shifted = NOTES[(idx + semitones + 1200) % 12];
    return shifted + rest;
  }

  function shapeKeyFor(chord) {
    const m = chord.match(/^([A-G])(#|b)?(m7|m6|dim|m|7)?$/);
    if (!m) return null;
    const [, root, acc, qual] = m;
    let note = root + (acc || '');
    if (FLAT_TO_SHARP[note]) note = FLAT_TO_SHARP[note];
    return note + (qual || '');
  }

  function shapeFor(chord) {
    const key = shapeKeyFor(chord);
    return key ? SHAPES[state.instrument][key] : null;
  }

  // Баррэ: на самом нижнем прижатом ладу две и больше струн, между крайними из них нет
  // струн ниже этого лада, и палец дотягивается до края играемых струн. Иначе это
  // обычная постановка разными пальцами (например, гитарный A — три пальца, а не баррэ).
  function barreSpan(shape) {
    const fretted = shape.filter(f => f > 0);
    if (!fretted.length) return null;
    const fret = Math.min(...fretted);
    const at = shape.reduce((acc, f, i) => (f === fret ? [...acc, i] : acc), []);
    if (at.length < 2) return null;
    const from = at[0], to = at[at.length - 1];
    for (let i = from; i <= to; i++) if (shape[i] < fret) return null;
    const played = shape.reduce((acc, f, i) => (f >= 0 ? [...acc, i] : acc), []);
    const fromBass = from === played[0];
    const solidRun = shape.slice(from, to + 1).every(f => f === fret);
    const smallBarre = solidRun && to === played[played.length - 1];
    if (!fromBass && !smallBarre) return null;
    return { fret, from, to };
  }

  function chordDiagramSVG(shape) {
    // Полоса над порожком нужна только под крестики заглушенных струн (гитара).
    // Открытые струны ничем не отмечаем — только точки прижатия.
    const marksTop = state.instrument === 'guitar';
    // leftX — поле от края до крайней струны: только чтобы точка не срезалась
    const gap = 14, leftX = 6, rows = 4, rowH = 14;
    const topY = marksTop ? 15 : 6;
    const bottomY = topY + rowH * rows;
    const vbH = bottomY + 6;
    const stringsX = shape.map((_, i) => leftX + gap * i);
    const lastX = stringsX[stringsX.length - 1];
    const fretted = shape.filter(f => f > 0);
    const maxF = Math.max(...shape);
    const base = (maxF > 4 && fretted.length) ? Math.min(...fretted) : 1;
    // Место справа нужно только под номер лада — без него схема занимает всю карточку
    const vbW = lastX + (base > 1 ? 15 : leftX);
    const scale = 1.15;
    let s = `<svg viewBox="0 0 ${vbW} ${vbH}" width="${Math.round(vbW * scale)}" height="${Math.round(vbH * scale)}" class="chord-svg" aria-hidden="true">`;
    stringsX.forEach(x => { s += `<line x1="${x}" y1="${topY}" x2="${x}" y2="${bottomY}" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.5"/>`; });
    for (let r = 0; r <= rows; r++) {
      const y = topY + rowH * r;
      const isNut = r === 0 && base === 1;
      s += `<line x1="${stringsX[0]}" y1="${y}" x2="${lastX}" y2="${y}" stroke="currentColor" stroke-width="${isNut ? 2.6 : 1}" stroke-opacity="${isNut ? 0.85 : 0.35}"/>`;
    }
    if (base > 1) s += `<text x="${lastX + 4}" y="${topY + rowH * 0.8}" font-size="8" fill="currentColor">${base}</text>`;

    const barre = barreSpan(shape);
    if (barre) {
      const y = topY + rowH * (barre.fret - base + 0.5);
      s += `<line x1="${stringsX[barre.from]}" y1="${y}" x2="${stringsX[barre.to]}" y2="${y}" stroke="currentColor" stroke-width="7.6" stroke-linecap="round"/>`;
    }

    shape.forEach((f, i) => {
      const x = stringsX[i];
      const markY = topY - 5;
      if (f === -1) {
        const d = 2.6;
        s += `<line x1="${x - d}" y1="${markY - d}" x2="${x + d}" y2="${markY + d}" stroke="currentColor" stroke-width="1.4"/>`;
        s += `<line x1="${x - d}" y1="${markY + d}" x2="${x + d}" y2="${markY - d}" stroke="currentColor" stroke-width="1.4"/>`;
      } else if (f > 0) {
        if (barre && f === barre.fret && i >= barre.from && i <= barre.to) return;
        const row = f - base + 1;
        if (row >= 1 && row <= rows) {
          const y = topY + rowH * (row - 0.5);
          s += `<circle cx="${x}" cy="${y}" r="3.8" fill="currentColor"/>`;
        }
      }
    });
    s += `</svg>`;
    return s;
  }

  function escapeHTML(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parseBody(body) {
    return body.split('\n').map(raw => {
      if (raw.trim() === '') return { blank: true };
      let lyric = '';
      const chords = [];
      let i = 0;
      while (i < raw.length) {
        if (raw[i] === '[') {
          const end = raw.indexOf(']', i);
          chords.push({ pos: lyric.length, chord: raw.slice(i + 1, end) });
          i = end + 1;
        } else {
          lyric += raw[i];
          i++;
        }
      }
      return { lyric, chords };
    });
  }

  function renderSheetHTML(parsedLines, semitones) {
    let html = '';
    for (const line of parsedLines) {
      if (line.blank) { html += `<div class="line blank"></div>`; continue; }
      let chordRow = '';
      let len = 0;
      for (const { pos, chord } of line.chords) {
        const shown = transposeChord(chord, semitones);
        if (pos > len) { chordRow += ' '.repeat(pos - len); len = pos; }
        chordRow += `<span class="chord-tok">${escapeHTML(shown)}</span>`;
        len += shown.length;
      }
      html += `<div class="line">`;
      html += `<div class="chords">${chordRow || '&nbsp;'}</div>`;
      html += `<div class="lyrics">${escapeHTML(line.lyric) || '&nbsp;'}</div>`;
      html += `</div>`;
    }
    return html;
  }

  function collectUsedChords(parsedLines, semitones) {
    const seen = new Set();
    const list = [];
    for (const line of parsedLines) {
      if (line.blank) continue;
      for (const { chord } of line.chords) {
        const shown = transposeChord(chord, semitones);
        if (!seen.has(shown)) { seen.add(shown); list.push(shown); }
      }
    }
    return list;
  }

  const state = {
    songId: null,
    semitones: 0,
    fontSize: 15,
    fontSizeChosen: false,
    variant: 0,
    instrument: 'uke',
    query: '',
    expandedArtists: new Set(),
    pinned: new Set(),
    scroll: { active: false, speed: 0 }
  };

  let savedSkin = null;
  try {
    const savedFont = localStorage.getItem('uke_fontsize');
    if (savedFont) { state.fontSize = parseInt(savedFont, 10); state.fontSizeChosen = true; }
    const savedInst = localStorage.getItem('uke_instrument');
    if (savedInst && SHAPES[savedInst]) state.instrument = savedInst;
    savedSkin = localStorage.getItem('uke_skin');
  } catch (e) {}

  function currentSong() {
    return SONGS.find(s => s.id === state.songId) || SONGS[0];
  }

  function saveFontSize() {
    state.fontSizeChosen = true;
    try { localStorage.setItem('uke_fontsize', String(state.fontSize)); } catch (e) {}
  }

  // На телефоне строки песни шире экрана: подбираем размер так, чтобы самая длинная
  // строка поместилась. Работает только пока размер не выбран вручную.
  function autoFitFontSize() {
    if (state.fontSizeChosen) return;
    const scroll = document.getElementById('chordsheet-scroll');
    const sheet = scroll && scroll.querySelector('.chordsheet');
    if (!sheet) return;
    const available = scroll.clientWidth;
    const needed = sheet.scrollWidth;
    if (!available || !needed || needed <= available) return;
    const fitted = Math.max(9, Math.floor(state.fontSize * available / needed));
    if (fitted === state.fontSize) return;
    state.fontSize = fitted;
    renderSheet();
  }

  // px/секунду для уровней 0..10 (0 — стоп). Нижние уровни — темп игры (строка за 2-5 секунд),
  // верхние — быстрая перемотка к нужному месту.
  const SCROLL_SPEEDS = [0, 8, 12, 17, 23, 30, 40, 55, 80, 115, 160];

  let rafId = null;
  let lastTs = null;
  let virtualTop = null;
  let appliedTop = null;
  function scrollStep(ts) {
    if (!state.scroll.active) return;
    const se = document.scrollingElement || document.documentElement;
    if (virtualTop == null) virtualTop = se.scrollTop;

    // Если страницу прокрутили вручную (колесо, свайп, клавиши), позиция ушла от нашей —
    // подхватываем её и едем дальше оттуда, а не дёргаем текст обратно.
    if (appliedTop != null && Math.abs(se.scrollTop - appliedTop) > 2) {
      virtualTop = se.scrollTop;
    }

    if (lastTs != null) {
      const dt = (ts - lastTs) / 1000;
      const maxTop = se.scrollHeight - se.clientHeight;
      virtualTop += SCROLL_SPEEDS[state.scroll.speed] * dt;
      if (virtualTop >= maxTop) {
        se.scrollTop = maxTop;
        stopScroll();
        return;
      }
      se.scrollTop = virtualTop;
      appliedTop = se.scrollTop;
    }
    lastTs = ts;
    rafId = requestAnimationFrame(scrollStep);
  }
  function startScroll() {
    if (state.scroll.active) return;
    state.scroll.active = true;
    lastTs = null;
    virtualTop = null;
    appliedTop = null;
    rafId = requestAnimationFrame(scrollStep);
    updateSpeedVal();
  }
  function stopScroll() {
    state.scroll.active = false;
    if (rafId) cancelAnimationFrame(rafId);
    updateSpeedVal();
  }
  function updateSpeedVal() {
    const el = document.getElementById('scroll-speed-val');
    if (!el) return;
    el.textContent = state.scroll.speed;
    el.classList.toggle('active', state.scroll.active);
  }
  function changeSpeed(delta) {
    state.scroll.speed = Math.max(0, Math.min(10, state.scroll.speed + delta));
    if (state.scroll.speed === 0) stopScroll();
    else startScroll();
    updateSpeedVal();
  }

  document.getElementById('scroll-faster').addEventListener('click', () => changeSpeed(1));
  document.getElementById('scroll-slower').addEventListener('click', () => changeSpeed(-1));

  function openSong(id) {
    state.songId = id;
    state.variant = 0;
    state.semitones = 0;
    state.pinned = new Set();
    state.scroll.speed = 0;
    stopScroll();
    expandArtistOf(id);
    setCatalog(false);
    location.hash = 'song=' + id;
    renderAll();
    window.scrollTo({ top: 0 });
  }

  // Клик по исполнителю в песне — показать всё его в меню.
  // На телефоне меню спрятано в панель, поэтому её нужно открыть, иначе клик «никуда не ведёт».
  function revealArtist(artist) {
    state.query = '';
    const search = document.getElementById('song-search');
    if (search) search.value = '';
    state.expandedArtists.add(artist);
    renderSonglist();
    setCatalog(true, false);

    const show = () => {
      const group = document.querySelector(`.artist-group[data-artist="${CSS.escape(artist)}"]`);
      if (!group) return;
      group.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      group.classList.add('flash');
      setTimeout(() => group.classList.remove('flash'), 1200);
    };
    // панель выезжает с анимацией — прокручиваем к группе, когда она уже на месте
    isNarrow() ? setTimeout(show, 240) : show();
  }

  // Оформление сайта: выбор пишется на <html> и запоминается в браузере
  const SKINS = ['vinyl', 'stage'];

  function applySkin(skin) {
    if (!SKINS.includes(skin)) skin = SKINS[0];
    document.documentElement.dataset.skin = skin;
    document.querySelectorAll('.skin-btn').forEach(b => {
      const on = b.dataset.skin === skin;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
    });
    try { localStorage.setItem('uke_skin', skin); } catch (e) {}
  }

  document.getElementById('skins').addEventListener('click', (e) => {
    const btn = e.target.closest('.skin-btn');
    if (btn) applySkin(btn.dataset.skin);
  });

  applySkin(savedSkin);

  // Выдвижной каталог — только на узком экране; на десктопе список всегда на виду
  function isNarrow() {
    return window.matchMedia('(max-width: 760px)').matches;
  }

  function setCatalog(open, focusSearch = true) {
    document.getElementById('songlist').classList.toggle('open', open);
    document.getElementById('catalog-backdrop').hidden = !open;
    document.getElementById('catalog-btn').setAttribute('aria-expanded', String(open));
    if (open && focusSearch && isNarrow()) document.getElementById('song-search').focus();
  }

  document.getElementById('catalog-btn').addEventListener('click', () => setCatalog(true));
  document.getElementById('catalog-close').addEventListener('click', () => setCatalog(false));
  document.getElementById('catalog-backdrop').addEventListener('click', () => setCatalog(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setCatalog(false); });

  document.getElementById('song-search').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderSonglist();
  });

  document.getElementById('song-search').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.target.value = ''; state.query = ''; renderSonglist(); }
  });

  function artistOf(song) {
    return song.artist || 'Без исполнителя';
  }

  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function groupByArtist(songs) {
    const groups = new Map();
    for (const song of songs) {
      const artist = artistOf(song);
      if (!groups.has(artist)) groups.set(artist, []);
      groups.get(artist).push(song);
    }
    return [...groups.entries()]
      .sort((a, b) => a[0].localeCompare(b[0], 'ru'))
      .map(([artist, list]) => [artist, list.sort((a, b) => a.title.localeCompare(b.title, 'ru'))]);
  }

  // «ё» и регистр не должны мешать найти песню
  function normalize(s) {
    return (s || '').toLowerCase().replace(/ё/g, 'е');
  }

  function matchingSongs() {
    const q = normalize(state.query).trim();
    if (!q) return { list: SONGS, searching: false };
    const words = q.split(/\s+/);
    const list = SONGS.filter(song => {
      const hay = normalize(song.title + ' ' + artistOf(song));
      return words.every(w => hay.includes(w));
    });
    return { list, searching: true };
  }

  // Группы свёрнуты по умолчанию — иначе при сотнях песен меню превращается
  // в бесконечную ленту. Развёрнута только та, где сейчас открытая песня.
  function expandArtistOf(songId) {
    const song = SONGS.find(s => s.id === songId);
    if (song) state.expandedArtists.add(artistOf(song));
  }

  function renderSonglist() {
    const nav = document.getElementById('songlist');
    const info = document.getElementById('search-info');
    nav.querySelectorAll('.artist-group').forEach(el => el.remove());

    const { list, searching } = matchingSongs();
    const groups = groupByArtist(list);

    const btnLabel = document.getElementById('catalog-btn-label');
    if (btnLabel) btnLabel.textContent = `Каталог — ${SONGS.length} ${plural(SONGS.length, 'песня', 'песни', 'песен')}`;

    if (searching) {
      info.hidden = false;
      info.textContent = list.length
        ? `Найдено: ${list.length} ${plural(list.length, 'песня', 'песни', 'песен')}`
        : 'Ничего не найдено';
    } else {
      info.hidden = true;
    }

    for (const [artist, songs] of groups) {
      // при поиске группы всегда раскрыты — иначе результат не виден
      const expanded = searching || state.expandedArtists.has(artist);
      const group = document.createElement('div');
      group.className = 'artist-group' + (expanded ? '' : ' collapsed');
      group.dataset.artist = artist;

      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'artist-head';
      head.setAttribute('aria-expanded', String(expanded));
      head.innerHTML = `<span class="chev">▾</span><span class="artist-name">${escapeHTML(artist)}</span><span class="artist-count">${songs.length}</span>`;
      head.addEventListener('click', () => {
        if (searching) return;
        if (state.expandedArtists.has(artist)) state.expandedArtists.delete(artist);
        else state.expandedArtists.add(artist);
        renderSonglist();
      });
      group.appendChild(head);

      for (const song of songs) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'song-btn' + (song.id === state.songId ? ' active' : '');
        btn.textContent = song.title;
        btn.addEventListener('click', () => openSong(song.id));
        group.appendChild(btn);
      }

      nav.appendChild(group);
    }
  }

  // Закреплённые аккорды живут внутри карточки песни, прямо над текстом, и «прилипают»
  // к верху экрана при прокрутке — чтобы подглядывать, не уводя взгляд к краю страницы.
  function pinnedPanelHTML() {
    const chords = [...state.pinned];
    if (!chords.length) return '';
    return `<div class="pinned-panel" id="pinned-panel">
      <span class="ph">Закреплено</span>
      <div class="pinned-list" id="pinned-list">
        ${chords.map(c => {
          const shape = shapeFor(c);
          return `<div class="pinned-item">
            <button type="button" class="unpin-btn" data-chord="${escapeHTML(c)}" aria-label="Открепить ${escapeHTML(c)}">✕</button>
            <span class="cc-name">${escapeHTML(c)}</span>
            ${shape ? chordDiagramSVG(shape) : `<span class="cc-noshape">?</span>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  function currentVariant() {
    const song = currentSong();
    return song.variants[Math.min(state.variant, song.variants.length - 1)];
  }

  function renderSheet() {
    const song = currentSong();
    const variant = currentVariant();
    const parsed = parseBody(variant.body);
    const displayKey = transposeChord(variant.key, state.semitones);
    const usedChords = collectUsedChords(parsed, state.semitones);
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = `
      <div class="sheet-head">
        <div>
          <div class="song-title">${escapeHTML(song.title)}</div>
          <button type="button" class="song-artist artist-link" id="song-artist-link" title="Показать все песни исполнителя">${escapeHTML(artistOf(song))}</button>
        </div>
        <div class="controls">
          <div class="ctrl-group" aria-label="Транспонирование">
            <span class="label">Тон</span>
            <button class="ctrl-btn" id="tr-down" aria-label="Ниже на полтона">–</button>
            <span class="key-badge">${escapeHTML(displayKey)}</span>
            <button class="ctrl-btn" id="tr-up" aria-label="Выше на полтона">+</button>
          </div>
          <div class="ctrl-group" aria-label="Размер шрифта">
            <span class="label">A</span>
            <button class="ctrl-btn" id="fs-down" aria-label="Меньше текст">–</button>
            <span class="fontsize-val">${state.fontSize}</span>
            <button class="ctrl-btn" id="fs-up" aria-label="Крупнее текст">+</button>
          </div>
          <div class="ctrl-group" id="inst-group" aria-label="Инструмент">
            ${Object.entries(INSTRUMENTS).map(([id, name]) => `
              <button type="button" class="inst-btn${state.instrument === id ? ' active' : ''}" data-inst="${id}" aria-pressed="${state.instrument === id}">${name}</button>
            `).join('')}
          </div>
        </div>
      </div>
      ${song.variants.length > 1 ? `
        <div class="variant-bar" id="variant-bar" aria-label="Вариант аккордов">
          <span class="variant-label">Вариант</span>
          ${song.variants.map((v, i) => `
            <button type="button" class="variant-btn${i === state.variant ? ' active' : ''}" data-variant="${i}" aria-pressed="${i === state.variant}">${escapeHTML(v.name || 'Вариант ' + (i + 1))}</button>
          `).join('')}
        </div>
      ` : ''}
      <div class="chord-gallery" id="chord-gallery">
        ${usedChords.map(c => {
          const shape = shapeFor(c);
          const pinned = state.pinned.has(c);
          return `<button type="button" class="chord-card${pinned ? ' pinned' : ''}" data-chord="${escapeHTML(c)}" aria-pressed="${pinned}" title="Закрепить ${escapeHTML(c)} на экране">
            <span class="cc-name">${escapeHTML(c)}</span>
            ${shape ? chordDiagramSVG(shape) : `<span class="cc-noshape">нет схемы</span>`}
          </button>`;
        }).join('')}
      </div>
      <div class="sheet-body">
        <div class="chordsheet-scroll" id="chordsheet-scroll">
          <div class="chordsheet" style="font-size:${state.fontSize}px">${renderSheetHTML(parsed, state.semitones)}</div>
        </div>
        ${pinnedPanelHTML()}
      </div>
    `;

    document.getElementById('tr-down').addEventListener('click', () => { state.semitones--; state.pinned = new Set(); renderSheet(); });
    document.getElementById('tr-up').addEventListener('click', () => { state.semitones++; state.pinned = new Set(); renderSheet(); });
    document.getElementById('fs-down').addEventListener('click', () => { state.fontSize = Math.max(9, state.fontSize - 1); saveFontSize(); renderSheet(); });
    document.getElementById('fs-up').addEventListener('click', () => { state.fontSize = Math.min(24, state.fontSize + 1); saveFontSize(); renderSheet(); });

    document.getElementById('song-artist-link').addEventListener('click', () => revealArtist(artistOf(song)));

    const variantBar = document.getElementById('variant-bar');
    if (variantBar) variantBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.variant-btn');
      if (!btn) return;
      const next = Number(btn.dataset.variant);
      if (next === state.variant) return;
      state.variant = next;
      state.semitones = 0;
      state.pinned = new Set();
      renderSheet();
    });

    document.getElementById('inst-group').addEventListener('click', (e) => {
      const btn = e.target.closest('.inst-btn');
      if (!btn || btn.dataset.inst === state.instrument) return;
      state.instrument = btn.dataset.inst;
      try { localStorage.setItem('uke_instrument', state.instrument); } catch (err) {}
      renderSheet();
    });

    document.getElementById('chord-gallery').addEventListener('click', (e) => {
      const card = e.target.closest('.chord-card');
      if (!card) return;
      const chord = card.dataset.chord;
      if (state.pinned.has(chord)) state.pinned.delete(chord); else state.pinned.add(chord);
      renderSheet();
    });

    document.getElementById('chordsheet-scroll').addEventListener('click', () => {
      if (state.scroll.active) { state.scroll.speed = 0; stopScroll(); }
    });

    const pinnedList = document.getElementById('pinned-list');
    if (pinnedList) pinnedList.addEventListener('click', (e) => {
      const btn = e.target.closest('.unpin-btn');
      if (!btn) return;
      state.pinned.delete(btn.dataset.chord);
      renderSheet();
    });

    autoFitFontSize();
  }

  function renderAll() {
    renderSonglist();
    renderSheet();
  }

  function initFromHash() {
    const m = location.hash.match(/song=([\w-]+)/);
    if (m && SONGS.some(s => s.id === m[1])) state.songId = m[1];
  }

  async function init() {
    const sheet = document.getElementById('sheet');
    try {
      SONGS = await loadSongs();
    } catch (e) {
      sheet.innerHTML = `<div class="song-artist">Не удалось загрузить песни (${escapeHTML(e.message)}). Для локального просмотра запусти страницу через локальный сервер или собери данные: node build.mjs</div>`;
      return;
    }
    if (!SONGS.length) {
      sheet.innerHTML = '<div class="song-artist">Пока нет ни одной песни: добавь файл в songs/ и пересобери страницу (node build.mjs).</div>';
      return;
    }
    state.songId = SONGS[0].id;
    initFromHash();
    expandArtistOf(state.songId);
    renderAll();
    updateSpeedVal();
  }

  window.addEventListener('hashchange', () => {
    initFromHash();
    state.variant = 0;
    state.semitones = 0;
    state.pinned = new Set();
    state.scroll.speed = 0;
    stopScroll();
    expandArtistOf(state.songId);
    renderAll();
    updateSpeedVal();
  });
  init();
</script>
